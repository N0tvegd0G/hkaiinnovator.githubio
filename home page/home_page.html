<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home · HK AI INNOVATOR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 浅色模式变量 (默认) */
        :root {
            --bg-body: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
            --bg-card: rgba(255, 255, 255, 0.85);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-link: #0071e3;
            --text-link-hover: #005fc4;
            --btn-primary: #0071e3;
            --btn-primary-hover: #0077ed;
            --shadow-card: 0 40px 80px rgba(0, 0, 0, 0.08), 0 15px 35px rgba(0, 0, 0, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.6);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* 深色模式变量 */
        body.dark {
            --bg-body: linear-gradient(135deg, #202024 0%, #2a2a2e 100%);
            --bg-card: rgba(45, 45, 47, 0.9);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a8;
            --text-link: #66b0ff;
            --text-link-hover: #99c4ff;
            --btn-primary: #66b0ff;
            --btn-primary-hover: #99c4ff;
            --shadow-card: 0 40px 80px rgba(0, 0, 0, 0.5), 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-body);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.4;
            color: var(--text-primary);
            transition: background 0.5s var(--ease-smooth), color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        body:not(.loaded) * {
            animation: none !important;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: background 0.3s var(--ease-smooth), transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s var(--ease-smooth), backdrop-filter 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            line-height: 1;
            z-index: 1000;
            will-change: transform, background;
        }

        body.dark .theme-toggle {
            background: rgba(45, 45, 47, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.9);
        }

        body.dark .theme-toggle:hover {
            background: rgba(45, 45, 47, 0.95);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* 头像容器 */
        .avatar-wrapper {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
        }

        /* 圆形头像 */
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            background-image: url('./profile_picture.png');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 113, 227, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-smooth), border-color 0.3s var(--ease-smooth);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            user-select: none;
        }}

        body.dark .avatar {
            background: rgba(45, 45, 47, 0.8);
            border: 2px solid rgba(102, 176, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .avatar:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 40px rgba(0, 113, 227, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 113, 227, 0.6);
        }

        body.dark .avatar:hover {
            box-shadow: 0 12px 40px rgba(102, 176, 255, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            border-color: rgba(102, 176, 255, 0.6);
        }

        /* 头像动画 */
        @keyframes avatarGrow {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            70% {
                transform: scale(1.08);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes avatarShrink {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            40% {
                transform: scale(0.08);
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .avatar.entering {
            animation: avatarGrow 0.9s var(--ease-spring) forwards;
        }

        .avatar.leaving {
            animation: avatarShrink 0.4s var(--ease-spring) forwards;
        }

        /* 侧边栏菜单 */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 420px;
            height: 100vh;
            background: var(--bg-card);
            backdrop-filter: blur(20px) saturate(180%);
            padding: 2rem 0;
            border-radius: 0 24px 24px 0;
            box-shadow: 4px 0 16px rgba(0, 0, 0, 0.15);
            transform: translateX(-100%);
            transition: transform 0.4s var(--ease-spring);
            z-index: 500;
            overflow-y: auto;
            clip-path: inset(0 0 0 0);
        }

        body.dark .sidebar {
            background: rgba(45, 45, 47, 0.9);
            box-shadow: 4px 0 16px rgba(0, 0, 0, 0.4);
        }

        .sidebar.open {
            transform: translateX(-120px);
        }

        /* 侧边栏关闭按钮 */
        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-primary);
            transition: transform 0.2s var(--ease-spring);
            padding: 0;
        }

        .sidebar-close:hover {
            transform: scale(1.1);
        }

        /* 侧边栏菜单项 */
        .sidebar-menu {
            margin-top: 4rem;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .menu-item {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0, 0, 0, 0.12);
            color: var(--text-primary);
            border: none;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s var(--ease-smooth), color 0.3s var(--ease-smooth);
            position: relative;
            overflow: hidden;
            text-align: right;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .menu-item:hover {
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
        }

        .menu-item:hover::before {
            opacity: 1;
        }

        body.dark .menu-item {
            background: rgba(255, 255, 255, 0.26);
            color: var(--text-primary);
        }

        body.dark .menu-item:hover {
            background: rgba(255, 255, 255, 0.38);
            color: var(--text-primary);
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--ease-smooth);
            z-index: 450;
        }

        .overlay.show {
            background: rgba(0, 0, 0, 0.3);
            opacity: 1;
            pointer-events: auto;
        }

        /* Log Out 弹窗样式 */
        .logout-modal-mask {
            position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.18); z-index: 2000; display: flex; align-items: center; justify-content: center;
            animation: logoutMaskFadeIn 0.3s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
        }
        .logout-modal {
            background: var(--bg-card); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.13);
            padding: 2.2rem 2.8rem; display: flex; flex-direction: column; align-items: center; min-width: 260px;
            border: 1px solid rgba(0,0,0,0.04);
            animation: logoutModalPopIn 0.4s var(--ease-spring) forwards;
        }
        .logout-modal-mask.hiding {
            animation: logoutMaskFadeOut 0.35s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
        }
        .logout-modal-mask.hiding .logout-modal {
            animation: logoutModalShrinkOut 0.35s var(--ease-spring) forwards;
        }
        .logout-modal-text {
            font-size: 1.13rem; color: var(--text-primary); margin-bottom: 1.5rem; font-weight: 600;
        }
        .logout-spinner {
            width: 48px; height: 48px; display: block;
        }
        .logout-spinner-c-bg {
            fill: none; stroke: #e0e7ef; stroke-width: 5; opacity: 0.5;
        }
        .logout-spinner-c {
            fill: none; stroke: #0071e3; stroke-width: 5; stroke-linecap: round;
            stroke-dasharray: 126; stroke-dashoffset: 126;
            transform-origin: 50% 50%;
            animation: logout-spin 1.2s cubic-bezier(0.34,1.56,0.64,1) infinite, logout-progress 2s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }
        @keyframes logout-spin {
            100% { transform: rotate(360deg); }
        }
        @keyframes logout-progress {
            100% { stroke-dashoffset: 0; }
        }
        @keyframes logoutMaskFadeIn {
            0% { background: rgba(0,0,0,0); }
            100% { background: rgba(0,0,0,0.18); }
        }
        @keyframes logoutMaskFadeOut {
            0% { background: rgba(0,0,0,0.18); opacity: 1; }
            100% { background: rgba(0,0,0,0); opacity: 0; }
        }
        @keyframes logoutModalPopIn {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); filter: blur(10px); }
            50% { transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        @keyframes logoutModalShrinkOut {
            0% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
            100% { opacity: 0; transform: scale(0.8) translateY(-20px); filter: blur(10px); }
        }

        /* Module Entry & Exit Animations */
        @keyframes slideInFromLeft {
            0% { opacity: 0; transform: translateX(-50px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInFromRight {
            0% { opacity: 0; transform: translateX(50px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInFromBottom {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideOutToLeft {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(-50px); }
        }

        @keyframes slideOutToRight {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(50px); }
        }

        @keyframes slideOutToBottom {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(50px); }
        }

        /* Module animations with delays */
        .news-feed-section {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1rem;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            grid-column: 1;
            grid-row: 1;
            overflow-y: auto;
            animation: slideInFromLeft 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .info-quick-section {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1rem;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            grid-column: 2;
            grid-row: 1;
            overflow-y: auto;
            animation: slideInFromRight 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
            opacity: 0;
        }

        body.dark .info-quick-section {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .jobs-section {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            grid-column: 1 / -1;
            grid-row: 2;
            overflow-y: auto;
            animation: slideInFromBottom 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
            opacity: 0;
        }

        body.dark .jobs-section {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Exit animations (triggered by JS) */
        .news-feed-section.exit-animation {
            animation: slideOutToLeft 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .info-quick-section.exit-animation {
            animation: slideOutToRight 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .jobs-section.exit-animation {
            animation: slideOutToBottom 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .sidebar-logout-btn {
            position: absolute;
            bottom: 1.5rem;
            left: 1.5rem;
            right: 1.5rem;
            background: var(--btn-primary);
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 0.85rem 2.2rem;
            font-size: 1.08rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,113,227,0.10);
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .sidebar-logout-btn:hover {
            background: var(--btn-primary-hover);
        }

        /* 主内容容器 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
            margin-left: 0;
            height: calc(100vh - 12rem);
            max-height: 85vh;
        }

        /* News Feed 模块 */

        body.dark .news-feed-section {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            position: sticky;
            top: 0;
            background: var(--bg-card);
            padding: 0.5rem 0;
            z-index: 10;
        }

        .refresh-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            line-height: 1;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .refresh-btn:hover {
            transform: scale(1.15);
        }

        body.dark .refresh-btn:hover {
            transform: scale(1.15);
        }

        .refresh-btn.spinning {
            animation: refreshSpinDown 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .refresh-btn.spinning-recovery {
            animation: refreshScaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes refreshSpinDown {
            0% {
                transform: rotate(0deg) scale(1);
            }
            100% {
                transform: rotate(360deg) scale(0.85);
            }
        }

        @keyframes refreshScaleUp {
            0% {
                transform: rotate(360deg) scale(0.85);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        .feed-items {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
        }

        .feed-item {
            padding: 0.55rem;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
            transition: background 0.3s var(--ease-smooth), transform 0.2s ease;
            cursor: pointer;
            position: relative;
            opacity: 0;
            animation: fadeInSlideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform: translateY(0);
        }

        .feed-item:nth-child(1) {
            animation-delay: 0s;
        }

        .feed-item:nth-child(2) {
            animation-delay: 0.1s;
        }

        .feed-item:nth-child(3) {
            animation-delay: 0.2s;
        }

        .feed-item:nth-child(4) {
            animation-delay: 0.3s;
        }

        .feed-item:nth-child(5) {
            animation-delay: 0.4s;
        }

        @keyframes fadeInSlideUp {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOutSlideDown {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(15px);
            }
        }

        .feed-item.exit {
            animation: fadeOutSlideDown 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
        }

        .feed-item.important::before {
            content: '❗';
            position: absolute;
            top: -0.15rem;
            left: -0.4rem;
            font-size: 1.1rem;
            display: block;
            line-height: 1;
        }

        body.dark .feed-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .feed-item:hover {
            background: rgba(0, 0, 0, 0.08);
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        body.dark .feed-item:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 24px rgba(255, 255, 255, 0.18);
        }

        .feed-item-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.15rem;
        }

        .feed-item-desc {
            font-size: 0.73rem;
            color: var(--text-secondary);
            line-height: 1.2;
            margin-bottom: 0.1rem;
        }

        .feed-item-source {
            font-size: 0.68rem;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        /* Info & Quick Job Section */

        body.dark .info-quick-section {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-box {
            padding: 1.2rem;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .current-job-opportunity {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 0.5rem;
            color: var(--text-secondary);
            transition: color 0.25s ease, font-weight 0.25s ease;
        }

        .current-job-opportunity.filled {
            color: var(--text-primary);
            font-weight: 600;
        }

        body.dark .info-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .quick-jobs {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex: 1;
        }

        .quick-job-item {
            padding: 0.7rem;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
            transition: background 0.3s var(--ease-smooth), transform 0.2s ease;
            cursor: pointer;
        }

        body.dark .quick-job-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .quick-job-item:hover {
            background: rgba(0, 0, 0, 0.08);
            transform: translateX(4px);
        }

        body.dark .quick-job-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .quick-job-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.15rem;
        }

        .quick-job-company {
            font-size: 0.75rem;
            color: var(--text-link);
        }

        /* Jobs 模块 */

        body.dark .jobs-section {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .job-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            flex: 1;
        }

        .job-item {

            async function fetchBBCCareerNews() {
                try {
                    const feedItemsContainer = document.getElementById('feedItemsContainer');
                    if (!feedItemsContainer) return;

                    // 获取推荐职业
                    let recommendedCareer = localStorage.getItem('recommendedCareer');

                    // 尝试多个 API 源
                    let articles = [];

                    // 使用 Gnews API，搜索推荐职业相关的新闻
                    try {
                        const keywords = recommendedCareer ? [recommendedCareer] : ['career', 'jobs', 'employment', 'recruitment', 'workplace'];
                        const randomKeyword = keywords[Math.floor(Math.random() * keywords.length)];
                        
                        const response = await fetch(
                            `https://gnews.io/api/v4/search?q=${encodeURIComponent(randomKeyword)}&lang=en&max=20`,
                            { method: 'GET', headers: { 'Accept': 'application/json' } }
                        );

                        if (response.ok) {
                            const data = await response.json();
                            articles = data.articles || [];
                        }
                    } catch (e) {
                        console.log('Gnews API failed, trying alternative...');
                    }

                    // 方案 2: 如果 Gnews 失败，使用硬编码的新闻源
                    if (articles.length === 0) {
                        articles = await fetchAlternativeNews();
                    }

                    // 如果仍然没有新闻，显示示例
                    if (articles.length === 0) {
                        articles = getDefaultNews(recommendedCareer);
                    }

                    if (articles.length > 0) {
                        // 只打新3条新闻
                        const shuffled = [...articles].sort(() => 0.5 - Math.random()).slice(0, 3);
                        
                        const newsHTML = shuffled

                                const formattedDate = pubDate.toLocaleDateString('en-US', { 
                                    month: 'short', 
                                    day: 'numeric', 
                                    year: 'numeric' 
                                });
                                const isImportant = index === 0 ? 'important' : '';
                                
                                return `
                                    <div class="feed-item ${isImportant}" data-url="${article.url || '#'}" style="cursor: pointer;">
                                        <div class="feed-item-title">${article.title}</div>
                                        <div class="feed-item-desc">${article.description || 'Read more...'}</div>
                                        <div class="feed-item-source">${article.source?.name || 'News Source'} • ${formattedDate}</div>
                                    </div>
                                `;
                            })
                            .join('');
                        
                        feedItemsContainer.innerHTML = newsHTML;
                        
                        // 为每个新闻项添加点击事件
                        document.querySelectorAll('#feedItemsContainer .feed-item[data-url]').forEach(item => {

                            });
                        });

            }, 45000);

            const refreshNewsBtn = document.getElementById('refreshNewsBtn');
            if (refreshNewsBtn) {
                refreshNewsBtn.addEventListener('click', async () => {
                    if (refreshNewsBtn.classList.contains('spinning') || refreshNewsBtn.classList.contains('spinning-recovery')) return;
                    refreshNewsBtn.classList.add('spinning');
                    await fetchBBCCareerNews();
                    setTimeout(() => {
                        refreshNewsBtn.classList.remove('spinning');
                        refreshNewsBtn.classList.add('spinning-recovery');
                        setTimeout(() => {
                            refreshNewsBtn.classList.remove('spinning-recovery');
                        }, 500);
                    }, 400);
                });
            }

                if (sidebar.classList.contains('open')) {
                    closeSidebar();
                } else {
                    sidebar.classList.add('open');
                    overlay.classList.add('show');
                }
            });

            // 关闭侧边栏
            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }

            overlay.addEventListener('click', closeSidebar);

                if (isAnimating) return;
                isAnimating = true;
                
                // 关闭侧边栏
                closeSidebar();
                
                // 头像缩小消失动画
                avatar.classList.remove('entering');
                avatar.classList.add('leaving');

                const newsFeed = document.querySelector('.news-feed-section');
